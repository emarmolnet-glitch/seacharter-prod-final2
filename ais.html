<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeaCharter - Prospección AIS de Flota</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #f8fafc; }
        .radar-workflow-hud { background: rgba(15, 23, 42, 0.95); border-bottom: 1fr solid rgba(255, 255, 255, 0.1); padding: 12px 20px; display: flex; flex-direction: column; gap: 12px; }
        .radar-workflow-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; align-items: center; }
        .radar-phase-card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 10px 14px; position: relative; }
        .radar-phase-card.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.15); }
        .radar-phase-card.done { border-color: #10b981; }
        .radar-phase-card .phase-number { font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 2px; }
        .radar-phase-card.active .phase-number { color: #60a5fa; }
        .radar-phase-card.done .phase-number { color: #34d399; }
        .radar-phase-card .phase-title { font-size: 0.9rem; font-weight: 600; color: #f8fafc; }
        .radar-phase-card .phase-status { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; display: flex; justify-content: space-between; align-items: center; }
        .radar-capture-monitor { display: flex; align-items: center; gap: 8px; font-family: monospace; font-size: 1.1rem; color: #38bdf8; }
        .radar-capture-spinner { width: 18px; height: 18px; border: 2px solid rgba(56, 189, 248, 0.3); border-top-color: #38bdf8; border-radius: 50%; animation: radarCaptureSpin 1s linear infinite; }
        .radar-taxonomy-panel { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; background: rgba(15, 23, 42, 0.6); padding: 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .radar-taxonomy-panel.locked { opacity: 0.5; pointer-events: none; }
        .radar-report-table-wrap { max-height: 240px; overflow-y: auto; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
        th { background: rgba(30, 41, 59, 0.9); color: #94a3b8; font-weight: 600; padding: 8px 12px; position: sticky; top: 0; }
        td { padding: 8px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: #e2e8f0; }
        tr:hover { background: rgba(51, 65, 85, 0.5); }
        .radar-primary-action { background: #2563eb; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .radar-primary-action:hover { background: #1d4ed8; }
        .radar-primary-action:disabled { background: #475569; cursor: not-allowed; }
        .ais-live-vessel-dot { display: block; width: 12px; height: 12px; border-radius: 50%; }
        .ais-live-vessel-dot.moving { animation: pulseAisDot 2s infinite; }
        @keyframes pulseAisDot { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }
        .ais-projection-meta { font-size: 0.72rem; color: #94a3b8; display: block; }
        .ais-eta-drift { color: #f59e0b; font-weight: bold; }
        .ais-load-pill { display: inline-block; min-width: 58px; padding: 3px 7px; border-radius: 4px; color: #fff; font-size: 0.72rem; font-weight: 900; text-align: center; }
        .ais-load-pill.ballast { background: #16a34a; }
        .ais-load-pill.laden { background: #2563eb; }
        .ais-radar-tab { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.2); color: #cbd5e1; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
        .ais-radar-tab.active-pol { background: #16a34a; color: #fff; border-color: #16a34a; }
        .ais-radar-tab.active-pod { background: #2563eb; color: #fff; border-color: #2563eb; }
        .ais-projection-toggle { background: rgba(30, 41, 59, 0.8); border: 1px solid #3b82f6; color: #60a5fa; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
        .ais-projection-toggle.active { background: #3b82f6; color: #fff; }
        .seacharter-ais-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(15, 23, 42, 0.8); border: 1.5px solid var(--marker-color, #3b82f6); color: var(--marker-color, #3b82f6); font-size: 11px; }
        .seacharter-ais-icon.ghost-ship { opacity: 0.65; border-style: dashed; }
        .seacharter-ais-icon.neighbor-node { border-width: 2px; }
        .seacharter-ais-icon.fleet-intel-match { box-shadow: 0 0 10px #f59e0b; }
        
        /* Real-Time Commercial Compatibility Glowing Style */
        .seacharter-ais-icon.compatible-vessel,
        .ais-live-vessel-marker.compatible-vessel,
        .ais-live-vessel-dot.compatible-vessel {
            border: 2px solid #22c55e !important;
            border-radius: 999px;
            box-shadow: 0 0 12px #22c55e, 0 0 24px rgba(34, 197, 94, 0.85) !important;
            animation: compatiblePulse 1.8s infinite ease-in-out;
            z-index: 999 !important;
        }
        @keyframes compatiblePulse {
            0% { box-shadow: 0 0 8px #22c55e, 0 0 16px rgba(34, 197, 94, 0.6); transform: scale(1); }
            50% { box-shadow: 0 0 18px #22c55e, 0 0 30px rgba(34, 197, 94, 0.95); transform: scale(1.18); }
            100% { box-shadow: 0 0 8px #22c55e, 0 0 16px rgba(34, 197, 94, 0.6); transform: scale(1); }
        }

        #map { height: calc(100vh - 280px); min-height: 400px; width: 100%; background: #0f172a; }
        @media (max-width: 820px) { .radar-workflow-grid { grid-template-columns: 1fr; } }
        @media (max-width: 620px) { .radar-taxonomy-panel { grid-template-columns: 1fr; } }
        @keyframes radarCaptureSpin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="radar-workflow-hud">
        <div class="radar-workflow-grid">
            <div class="radar-phase-card active" data-radar-phase="capture">
                <div class="phase-number">Fase 1</div>
                <div class="phase-title">Barrido de Captura</div>
                <div class="phase-status">
                    <span id="radar-capture-timer">01:00</span>
                    <button class="radar-primary-action" id="btn-refresh-ais" style="padding:4px 10px; font-size:0.75rem;">REFRESCAR / BUSCAR</button>
                </div>
            </div>
            <div class="radar-phase-card" data-radar-phase="freeze">
                <div class="phase-number">Fase 2</div>
                <div class="phase-title">Freeze State</div>
                <div class="phase-status">
                    <span id="radar-frozen-timestamp" style="display:none;"></span>
                    <button class="radar-primary-action" id="btn-freeze-radar" style="padding:4px 10px; font-size:0.75rem; background:#dc3545;" onclick="window.toggleLiveTracking()">Radar: FROZEN</button>
                </div>
            </div>
            <div class="radar-phase-card" data-radar-phase="taxonomy">
                <div class="phase-number">Fase 3</div>
                <div class="phase-title">Taxonomía</div>
                <div class="phase-status">
                    <span id="radar-snapshot-count">0</span> buques
                </div>
            </div>
            <div class="radar-phase-card" data-radar-phase="report">
                <div class="phase-number">Fase 4</div>
                <div class="phase-title">Informe</div>
                <div class="phase-status">
                    <button class="radar-primary-action" id="btn-run-match-engine" style="padding:4px 10px; font-size:0.75rem;" disabled>Ejecutar Match</button>
                </div>
            </div>
            <div class="radar-phase-card" data-radar-phase="audit">
                <div class="phase-number">Fase 5</div>
                <div class="phase-title">Modo Auditoría</div>
                <div class="phase-status">
                    <button class="radar-primary-action" id="btn-audit-mode" style="padding:4px 10px; font-size:0.75rem; background:#8b5cf6;" onclick="window.toggleAuditMode()">Modo Auditoría: OFF</button>
                </div>
            </div>
        </div>

        <div class="radar-taxonomy-panel locked" id="radar-taxonomy-panel" aria-hidden="true">
            <div>
                <label style="font-size:0.8rem; color:#94a3b8; display:block; margin-bottom:4px;">Selección de Taxonomía Commercial:</label>
                <select id="radar-taxonomy-select" style="width:100%; background:#1e293b; color:#f8fafc; border:1px solid #475569; padding:6px; border-radius:4px; font-size:0.85rem;" disabled>
                    <option value="cargo">Cargo General / Bulk Carrier / Cement</option>
                    <option value="cement">Cement Carrier (Específico)</option>
                    <option value="bulk">Bulk Carrier (Graneleros)</option>
                    <option value="general">General Cargo / Break Bulk</option>
                    <option value="container">Container Ships</option>
                    <option value="tanker">Tankers (Petroleros / Químicos)</option>
                </select>
            </div>
            <div style="display:flex; align-items:flex-end; gap:8px;">
                <button class="radar-primary-action" id="btn-clear-radar-report" style="padding:6px 12px; font-size:0.8rem; background:#475569;">Limpiar Informe</button>
            </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(30, 41, 59, 0.4); padding:6px 12px; border-radius:6px; font-size:0.8rem;">
            <div>
                <span style="color:#94a3b8;">Estado del flujo:</span>
                <strong id="radar-workflow-status" style="color:#38bdf8; margin-left:6px;">Ready</strong>
                <span id="radar-audit-status" style="color:#a78bfa; margin-left:12px;"></span>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
                <button class="ais-radar-tab active-pol" id="btn-search-pol">POL (2000 MN)</button>
                <button class="ais-radar-tab active-pod" id="btn-search-pod">POD (100 MN)</button>
                <button class="ais-projection-toggle" id="btn-projection-matching">MODO MATCHING: OFF</button>
                <span style="color:#94a3b8; margin-left:8px;">Progreso: <strong id="ais-storage-progress" style="color:#f8fafc;">0%</strong></span>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <div style="padding: 12px 20px;">
        <h3 style="margin: 0 0 8px 0; font-size: 1rem; color: #f8fafc;">Informe de Coincidencias de Radar</h3>
        <div class="radar-report-table-wrap" id="radar-report-table">
            <div style="padding:14px; color:#64748b; font-weight:600;">Completa un barrido o activa el Modo Auditoría para ver el informe.</div>
        </div>
    </div>

    <!-- Hidden elements for state compatibility -->
    <div style="display:none;">
        <span id="vessels-count">0</span>
        <span id="geofence-pol-name">Not Selected</span>
        <span id="geofence-pol-coords">0, 0</span>
        <span id="geofence-summary-text"></span>
        <input type="text" id="port-pol" value="Valencia">
        <input type="text" id="port-pod" value="Béjaïa">
        <input type="text" id="aisstream-api-key" value="">
        <input type="number" id="filter-min-dwt" value="0">
        <input type="number" id="filter-max-dwt" value="200000">
        <input type="number" id="filter-port-max-dwt" value="0">
        <input type="number" id="filter-max-distance" value="2000">
        <input type="checkbox" id="filter-strict-geofence">
        <select id="fleet-intel-vessel-type"><option value="category:cargo">Cargo</option></select>
        <button id="btn-apply-filters"></button>
        <button id="btn-reset-filters"></button>
        <tbody id="ais-vessels-tbody"></tbody>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="/map_loader.js"></script>
    <script>
        window.AIS_DUAL_SWEEP_LIMIT = 1000;
        window.AIS_RADAR_POL_RADIUS_NM = 2000;
        window.AIS_RADAR_POD_RADIUS_NM = 100;
        window.AIS_ROUTE_CORRIDOR_RADIUS_NM = 100;
        window.AIS_RADAR_COLORS = { POL: '#16a34a', POD: '#2563eb', ROUTE: '#3b82f6', GLOBAL: '#64748b' };
        window.aisRadarZoneState = { pol: true, pod: true };
        window.aisProjectionMatchingMode = false;
        window.buquesAlmacenados = new Map();
        window.buquesEncontrados = {};
        window.aisVesselIdentityIndex = new Map();
        window.dataBridgeAuditReceipts = {};
        window.radarWorkflowState = {
            phase: 'capture',
            captureSeconds: 60,
            captureTimer: null,
            captureTimeout: null,
            captureStartedAt: null,
            captureEndsAt: null,
            frozenAt: null,
            frozenSnapshot: [],
            selectedTaxonomy: 'cargo',
            report: null,
            auditMode: false,
            auditLoading: false,
            auditVessels: []
        };

        const RADAR_TAXONOMIES = {
            cargo: { key: 'cargo', label: 'Cargo General / Bulk Carrier / Cement', codes: [70,71,72,73,74,75,76,77,78,79], terms: ['bulk', 'bulker', 'cargo', 'general cargo', 'cement', 'cemento'] },
            cement: { key: 'cement', label: 'Cement Carrier', codes: [70,79], terms: ['cement', 'cemento', 'clinker'] },
            bulk: { key: 'bulk', label: 'Bulk Carrier', codes: [70,79], terms: ['bulk', 'bulker', 'dry bulk'] },
            general: { key: 'general', label: 'General Cargo', codes: [70,79], terms: ['general cargo', 'break bulk', 'breakbulk'] },
            container: { key: 'container', label: 'Container Ships', codes: [71,72,73,74], terms: ['container'] },
            tanker: { key: 'tanker', label: 'Tankers', codes: [80,81,82,83,84,85,86,87,88,89], terms: ['tanker', 'chemical', 'product tanker', 'oil'] }
        };

        function filtrarRadarPorTipoLocal(lista, taxonomyKey) {
            const taxonomy = RADAR_TAXONOMIES[taxonomyKey] || RADAR_TAXONOMIES.cargo;
            return (Array.isArray(lista) ? lista : []).filter(vessel => {
                if (!vessel) return false;
                const meta = vessel.MetaData || {};
                const shipTypeRaw = vessel.shipType || vessel.ShipType || meta.ShipType || meta.shipType;
                const numericType = Number(shipTypeRaw);
                if (Number.isFinite(numericType)) {
                    return taxonomy.codes.includes(numericType);
                }
                const text = [
                    shipTypeRaw,
                    vessel.type,
                    vessel.vesselType,
                    meta.type,
                    meta.vesselType
                ].filter(Boolean).join(' ').toLowerCase();
                return taxonomy.terms.some(term => text.includes(term));
            });
        }

        function toRadarReportRow(vessel) {
            const meta = vessel.MetaData || {};
            const distanceToPolNm = vessel.distanceToPolNm ?? meta.distanceToPolNm;
            const distanceToPodNm = vessel.distanceToPodNm ?? meta.distanceToPodNm;
            const destinationAvailability = !!(vessel.destinationAvailability || meta.destinationAvailability);
            return {
                id: vessel.id || vessel.mmsi || vessel.MMSI || meta.MMSI || vessel.imo || vessel.IMO || meta.IMO,
                mmsi: vessel.mmsi || vessel.MMSI || meta.MMSI || 'N/A',
                imo: vessel.imo || vessel.IMO || meta.IMO || 'N/A',
                nombre: vessel.nombre || vessel.name || vessel.vesselName || vessel.ShipName || meta.ShipName || 'Unknown',
                estadoCarga: vessel.loadState || vessel.estado_carga || meta.loadState || meta.estado_carga || 'N/A',
                distanciaPolNm: distanceToPolNm,
                distanciaPodNm: distanceToPodNm,
                disponibilidadDestino: destinationAvailability,
                alertaCoincidencia: destinationAvailability ? 'Disponibilidad Destino' : '',
                isCompatible: vessel.isCompatible === true || meta.isCompatible === true
            };
        }

        function getRadarReportVesselId(vessel) {
            if (!vessel || typeof vessel !== 'object') return '';
            const candidates = [vessel.id, vessel.mmsi, vessel.MMSI, vessel.imo, vessel.IMO, vessel.nombre, vessel.name, vessel.vesselName];
            for (const candidate of candidates) {
                const value = String(candidate || '').trim();
                if (value && value !== 'N/A' && value !== '0' && value.toLowerCase() !== 'unknown') return value;
            }
            return '';
        }

        function isRadarReportVesselPendingAudit(vessel) {
            const id = getRadarReportVesselId(vessel);
            return Boolean(id && window.dataBridgeAuditReceipts && window.dataBridgeAuditReceipts[id]?.action === 'pending_audit');
        }

        function persistDataBridgeAuditReceipts() {
            try {
                localStorage.setItem('corepro_data_bridge_audit_receipts', JSON.stringify(window.dataBridgeAuditReceipts || {}));
            } catch (_) {}
        }

        function markRadarVesselsPendingAudit(vessels, payload) {
            const acceptedAt = payload?.acceptedAt || new Date().toISOString();
            const action = payload?.action || 'pending_audit';
            const receiptRows = Array.isArray(payload?.vessels) ? payload.vessels : vessels;
            const acceptedIds = new Set(receiptRows.map(getRadarReportVesselId).filter(Boolean));
            vessels.forEach(vessel => {
                const id = getRadarReportVesselId(vessel);
                if (!id || (acceptedIds.size > 0 && !acceptedIds.has(id))) return;
                window.dataBridgeAuditReceipts[id] = {
                    action,
                    status: payload?.status || 'success',
                    acceptedAt,
                    name: vessel.nombre || vessel.name || vessel.vesselName || 'Unknown vessel'
                };
            });
            persistDataBridgeAuditReceipts();
        }

        function formatDateForBridge(dateString) {
            if (typeof dateString !== 'string') return dateString;
            const value = dateString.trim();
            if (!value) return dateString;
            if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
            const parsed = new Date(value);
            if (Number.isNaN(parsed.getTime())) return dateString;
            return parsed.toISOString().slice(0, 10);
        }
        window.formatDateForBridge = window.formatDateForBridge || formatDateForBridge;

        function setRadarWorkflowPhase(phase) {
            window.radarWorkflowState.phase = phase;
            document.querySelectorAll('[data-radar-phase]').forEach(item => {
                const itemPhase = item.getAttribute('data-radar-phase');
                item.classList.toggle('active', itemPhase === phase);
                const order = ['capture', 'freeze', 'taxonomy', 'report', 'audit'];
                item.classList.toggle('done', order.indexOf(itemPhase) < order.indexOf(phase));
            });
            const statusEl = document.getElementById('radar-workflow-status');
            if (statusEl) statusEl.innerText = {
                capture: 'Capturing',
                freeze: 'Frozen',
                taxonomy: 'Select',
                report: 'Report',
                audit: 'Audit DB'
            }[phase] || 'Ready';
        }

        function formatRadarCountdown(seconds) {
            const safeSeconds = Math.max(0, Number(seconds) || 0);
            const minutes = Math.floor(safeSeconds / 60);
            const remainder = safeSeconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(remainder).padStart(2, '0')}`;
        }

        function updateRadarWorkflowUi() {
            const state = window.radarWorkflowState;
            const timerEl = document.getElementById('radar-capture-timer');
            const taxonomyPanel = document.getElementById('radar-taxonomy-panel');
            const taxonomySelect = document.getElementById('radar-taxonomy-select');
            const countEl = document.getElementById('radar-snapshot-count');
            const matchBtn = document.getElementById('btn-run-match-engine');
            const auditBtn = document.getElementById('btn-audit-mode');
            const captureBtn = document.getElementById('btn-refresh-ais');
            const isAuditMode = !!state.auditMode;
            const isCapturing = !isAuditMode && state.phase === 'capture' && !!state.captureStartedAt && !state.frozenAt;
            const remaining = isCapturing && state.captureEndsAt
                ? Math.max(0, Math.ceil((state.captureEndsAt - Date.now()) / 1000))
                : (state.frozenAt ? 0 : state.captureSeconds);
            if (timerEl) {
                timerEl.innerText = isAuditMode ? 'Captura desactivada' : (state.frozenAt ? 'Barrido completado' : formatRadarCountdown(remaining));
            }
            if (taxonomyPanel) {
                taxonomyPanel.classList.toggle('locked', !state.frozenAt && !isAuditMode);
                taxonomyPanel.setAttribute('aria-hidden', state.frozenAt || isAuditMode ? 'false' : 'true');
            }
            if (taxonomySelect) {
                taxonomySelect.disabled = !state.frozenAt && !isAuditMode;
            }
            const frozenCount = (isAuditMode ? state.auditVessels : state.frozenSnapshot)?.length || 0;
            if (countEl) countEl.innerText = String(frozenCount || window.buquesAlmacenados.size || 0);
            if (matchBtn) matchBtn.disabled = state.auditLoading || ((!state.frozenAt && !isAuditMode) || frozenCount === 0);
            if (auditBtn) {
                auditBtn.disabled = state.auditLoading;
                auditBtn.classList.toggle('loading', state.auditLoading);
                auditBtn.setAttribute('aria-pressed', isAuditMode ? 'true' : 'false');
                auditBtn.innerText = state.auditLoading ? 'Cargando datos auditados…' : `Modo Auditoría: ${isAuditMode ? 'ACTIVO' : 'OFF'}`;
            }
            if (captureBtn) {
                captureBtn.disabled = isCapturing || isAuditMode;
                captureBtn.style.cursor = isCapturing || isAuditMode ? 'not-allowed' : 'pointer';
                captureBtn.innerHTML = isAuditMode
                    ? 'CAPTURA DESACTIVADA'
                    : isCapturing
                    ? `<span class="radar-capture-spinner" style="width:14px;height:14px;border-width:2px;display:inline-block;vertical-align:-2px;margin-right:6px;"></span>Capturando ${remaining}s`
                    : 'REFRESCAR / BUSCAR';
            }
        }

        function getRadarMatchSource() {
            const state = window.radarWorkflowState;
            return state.auditMode ? state.auditVessels : state.frozenSnapshot;
        }

        async function setAuditMode(enabled) {
            const state = window.radarWorkflowState;
            const statusEl = document.getElementById('radar-audit-status');
            if (state.auditLoading || enabled === state.auditMode) return;

            if (!enabled) {
                state.auditMode = false;
                state.auditVessels = [];
                state.frozenAt = null;
                state.frozenSnapshot = [];
                state.report = null;
                window.rawVesselsInArea = [];
                window.buquesAlmacenados.clear();
                window.aisVesselIdentityIndex.clear();
                renderRadarReport(null);
                window.actualizarVistaRadar();
                setRadarWorkflowPhase('capture');
                if (statusEl) statusEl.innerText = 'Modo en vivo disponible. Inicia un nuevo barrido cuando lo necesites.';
                updateRadarWorkflowUi();
                return;
            }

            cancelRadarCapture();
            state.auditMode = true;
            state.auditLoading = true;
            state.report = null;
            state.auditVessels = [];
            window.isLiveTrackingEnabled = false;
            window.AIS_PROXY_POLLING_ACTIVE = false;
            if (typeof window.closeDirectAisStreamSocket === 'function') window.closeDirectAisStreamSocket('audit-mode');
            if (window.MapLoader && typeof window.MapLoader.stopAisProxyPolling === 'function') window.MapLoader.stopAisProxyPolling();
            setRadarWorkflowPhase('audit');
            if (statusEl) statusEl.innerText = 'Consultando ais_vessels validados…';
            updateRadarWorkflowUi();

            try {
                const response = await fetch('/api/audit-vessels', { headers: { Accept: 'application/json' }, cache: 'no-store' });
                const payload = await response.json();
                if (!response.ok) throw new Error(payload.error || 'No se pudieron cargar los datos auditados.');
                const vessels = Array.isArray(payload.vessels) ? payload.vessels : [];
                state.auditVessels = vessels;
                state.frozenSnapshot = vessels;
                state.frozenAt = new Date().toISOString();
                window.buquesAlmacenados.clear();
                window.aisVesselIdentityIndex.clear();
                window.buquesEncontrados = {};
                vessels.forEach(vessel => window.procesarMensajeAIS(vessel, { source: 'audit' }));
                window.rawVesselsInArea = vessels;
                window.actualizarVistaRadar();
                window.runRadarMatchEngine();
                if (statusEl) statusEl.innerText = `${vessels.length} registros VALIDATED cargados desde Neon.`;
            } catch (error) {
                state.auditMode = false;
                state.auditVessels = [];
                state.frozenSnapshot = [];
                state.frozenAt = null;
                setRadarWorkflowPhase('capture');
                if (statusEl) statusEl.innerText = error instanceof Error ? error.message : 'No se pudieron cargar los datos auditados.';
            } finally {
                state.auditLoading = false;
                updateRadarWorkflowUi();
            }
        }

        window.toggleAuditMode = function() {
            return setAuditMode(!window.radarWorkflowState.auditMode);
        };

        function cancelRadarCapture() {
            const state = window.radarWorkflowState;
            window.aisRelaxFleetFiltersDuringCapture = false;
            if (typeof window.closeDirectAisStreamSocket === 'function') {
                window.closeDirectAisStreamSocket('cancel');
            }
            clearInterval(state.captureTimer);
            clearTimeout(state.captureTimeout);
            state.captureTimer = null;
            state.captureTimeout = null;
            state.captureStartedAt = null;
            state.captureEndsAt = null;
            state.frozenAt = null;
            setRadarWorkflowPhase('capture');
            updateRadarWorkflowUi();
        }

        function freezeRadarSnapshot() {
            const state = window.radarWorkflowState;
            clearInterval(state.captureTimer);
            clearTimeout(state.captureTimeout);
            state.captureTimer = null;
            state.captureTimeout = null;
            state.captureEndsAt = null;
            window.isLiveTrackingEnabled = false;
            window.AIS_PROXY_POLLING_ACTIVE = false;
            if (typeof window.closeDirectAisStreamSocket === 'function') {
                window.closeDirectAisStreamSocket('freeze');
            }
            if (window.MapLoader && typeof window.MapLoader.stopAisProxyPolling === 'function') {
                window.MapLoader.stopAisProxyPolling();
            }
            state.frozenAt = new Date().toISOString();
            state.frozenSnapshot = Array.from(window.buquesAlmacenados.values()).map(v => JSON.parse(JSON.stringify(v)));
            window.rawVesselsInArea = state.frozenSnapshot;
            setRadarWorkflowPhase('taxonomy');
            if (typeof window.runRadarMatchEngine === 'function') {
                window.runRadarMatchEngine();
            }
            const timestampEl = document.getElementById('radar-frozen-timestamp');
            if (timestampEl) {
                timestampEl.innerText = `Frozen at ${new Date(state.frozenAt).toLocaleTimeString()}`;
                timestampEl.style.display = 'inline-block';
            }
            const btn = document.getElementById('btn-freeze-radar');
            if (btn) {
                btn.innerText = 'Radar: FROZEN';
                btn.style.backgroundColor = '#dc3545';
            }
            updateRadarWorkflowUi();
        }

        function renderRadarReport(report) {
            const container = document.getElementById('radar-report-table');
            if (!container) return;
            const rows = report && Array.isArray(report.vessels) ? report.vessels : [];
            const isAuditReport = report?.source === 'audit_database';
            if (!rows.length) {
                container.innerHTML = '<div style="padding:14px; color:#64748b; font-weight:800;">Sin coincidencias para la taxonomía seleccionada.</div>';
                return;
            }
            container.innerHTML = `<table style="margin:0;"><thead><tr><th>MMSI</th><th>IMO</th><th>Nombre</th><th>Estado</th><th>Dist. POL</th><th>Dist. POD</th><th>Coincidencia / Compatibilidad</th><th>${isAuditReport ? 'Auditoría' : 'Data Bridge'}</th></tr></thead><tbody>${rows.map(row => {
                const pendingAudit = isRadarReportVesselPendingAudit(row);
                const compatPill = row.isCompatible === true
                    ? '<span style="display:inline-flex;align-items:center;gap:4px;background:#dcfce7;color:#15803d;border:1px solid #86efac;border-radius:999px;padding:2px 7px;font-weight:900;font-size:0.7rem;">⚡ COMPATIBLE</span>'
                    : '<span style="color:#64748b;font-size:0.7rem;">Incompatible</span>';
                const availabilityCell = row.disponibilidadDestino
                    ? `<span style="display:inline-flex;align-items:center;gap:5px;background:#dbeafe;color:#1d4ed8;border:1px solid #60a5fa;border-radius:999px;padding:3px 8px;font-weight:900;">Disponibilidad Destino</span> ${compatPill}`
                    : compatPill;
                const bridgeCell = isAuditReport
                    ? '<span style="display:inline-flex;align-items:center;gap:5px;background:#dcfce7;color:#166534;border:1px solid #4ade80;border-radius:999px;padding:3px 8px;font-weight:900;">✓ VALIDATED</span>'
                    : pendingAudit
                    ? '<span style="display:inline-flex;align-items:center;gap:5px;background:#fef3c7;color:#92400e;border:1px solid #f59e0b;border-radius:999px;padding:3px 8px;font-weight:900;">⏳ En Auditoría</span>'
                    : '<button type="button" class="radar-primary-action" style="padding:4px 8px;font-size:0.7rem;" onclick="window.exportSingleRadarVesselToDataBridge(this)" data-vessel-id="' + getRadarReportVesselId(row).replace(/"/g, '&quot;') + '">Exportar</button>';
                return `<tr data-bridge-state="${pendingAudit ? 'pending_audit' : 'ready'}" data-destination-availability="${row.disponibilidadDestino ? 'true' : 'false'}"><td>${row.mmsi}</td><td>${row.imo}</td><td>${row.nombre}</td><td>${row.estadoCarga}</td><td>${Number.isFinite(row.distanciaPolNm) ? Math.round(row.distanciaPolNm) + ' MN' : 'N/A'}</td><td>${Number.isFinite(row.distanciaPodNm) ? Math.round(row.distanciaPodNm) + ' MN' : 'N/A'}</td><td>${availabilityCell}</td><td>${bridgeCell}</td></tr>`;
            }).join('')}</tbody></table>`;
        }

        window.runRadarMatchEngine = function() {
            const select = document.getElementById('radar-taxonomy-select');
            const taxonomyKey = select ? select.value : window.radarWorkflowState.selectedTaxonomy;
            window.radarWorkflowState.selectedTaxonomy = taxonomyKey;
            const taxonomy = RADAR_TAXONOMIES[taxonomyKey] || RADAR_TAXONOMIES.cargo;
            const sourceVessels = getRadarMatchSource();
            const vessels = sourceVessels?.length > 0 ? filtrarRadarPorTipoLocal(sourceVessels, taxonomyKey)
                .map(toRadarReportRow)
                .filter(row => (
                    (row.estadoCarga === 'Laden' && Number.isFinite(row.distanciaPolNm) && row.distanciaPolNm <= AIS_RADAR_POL_RADIUS_NM) ||
                    (row.estadoCarga === 'Ballast' && Number.isFinite(row.distanciaPodNm) && row.distanciaPodNm <= AIS_RADAR_POD_RADIUS_NM)
                )) : [];
            window.radarWorkflowState.report = {
                generatedAt: new Date().toISOString(),
                frozenAt: window.radarWorkflowState.frozenAt,
                source: window.radarWorkflowState.auditMode ? 'audit_database' : 'live_radar',
                taxonomy: { key: taxonomyKey, label: taxonomy.label },
                vessels
            };
            setRadarWorkflowPhase('report');
            renderRadarReport(window.radarWorkflowState.report);
            updateRadarWorkflowUi();
        };

        window.obtenerIdUnicoBuque = function(buque) {
            if (!buque || typeof buque !== 'object') return '';
            const meta = buque.MetaData || {};
            const candidates = [
                buque.id,
                buque.MMSI,
                buque.mmsi,
                meta.MMSI,
                buque.IMO,
                buque.imo,
                meta.IMO
            ];
            for (const candidate of candidates) {
                const value = String(candidate || '').trim();
                if (value && value !== 'N/A' && value !== '0' && value.toLowerCase() !== 'unknown') {
                    return value;
                }
            }
            return '';
        };

        function getAisVesselIdentityKeys(vessel) {
            if (!vessel || typeof vessel !== 'object') return [];
            const meta = vessel.MetaData || {};
            const keys = [
                vessel.MMSI,
                vessel.mmsi,
                meta.MMSI,
                meta.mmsi,
                vessel.IMO,
                vessel.imo,
                meta.IMO,
                meta.imo
            ];
            return Array.from(new Set(keys
                .map(value => String(value || '').trim())
                .filter(value => value && value !== 'N/A' && value !== '0' && value.toLowerCase() !== 'unknown')));
        }

        function getIndexedAisVessel(vessel, primaryId = '') {
            const keys = primaryId ? [primaryId].concat(getAisVesselIdentityKeys(vessel)) : getAisVesselIdentityKeys(vessel);
            for (const key of keys) {
                const indexedId = window.aisVesselIdentityIndex.get(key);
                if (indexedId && window.buquesAlmacenados.has(indexedId)) {
                    return { id: indexedId, vessel: window.buquesAlmacenados.get(indexedId) };
                }
                if (window.buquesAlmacenados.has(key)) {
                    return { id: key, vessel: window.buquesAlmacenados.get(key) };
                }
            }
            return { id: primaryId || keys[0] || '', vessel: null };
        }

        function indexAisVesselIdentities(vessel, primaryId) {
            const id = String(primaryId || window.obtenerIdUnicoBuque(vessel) || '').trim();
            if (!id) return;
            getAisVesselIdentityKeys(vessel).forEach(key => window.aisVesselIdentityIndex.set(key, id));
            window.aisVesselIdentityIndex.set(id, id);
        }

        function firstAisText() {
            for (let i = 0; i < arguments.length; i++) {
                const value = arguments[i];
                if (value === undefined || value === null) continue;
                const text = String(value).trim();
                if (text && text !== 'N/A' && text !== '0' && text.toLowerCase() !== 'unknown') return text;
            }
            return '';
        }

        function normalizeAisDestination(value) {
            const text = String(value || '').trim();
            if (!text || text.toUpperCase() === 'NOT AVAILABLE' || text.toUpperCase() === 'N/A') {
                return 'Destino no declarado';
            }
            return text;
        }

        function mergeAisVesselState(previous, next) {
            const prev = previous || {};
            const incoming = next || {};
            const prevMeta = prev.MetaData || {};
            const nextMeta = incoming.MetaData || {};
            const imo = firstAisText(incoming.IMO, incoming.imo, nextMeta.IMO, nextMeta.imo, prev.IMO, prev.imo, prevMeta.IMO, prevMeta.imo);
            const destination = normalizeAisDestination(firstAisText(incoming.destination, incoming.Destination, nextMeta.Destination, nextMeta.destination, prev.destination, prev.Destination, prevMeta.Destination, prevMeta.destination));
            const eta = firstAisText(incoming.eta, incoming.ETA, incoming.eta_puerto_carga, nextMeta.ETA, nextMeta.eta, prev.eta, prev.ETA, prev.eta_puerto_carga, prevMeta.ETA, prevMeta.eta);

            const mergedMeta = Object.assign({}, prevMeta, nextMeta, {
                IMO: imo || 'N/A',
                Destination: destination
            });
            if (eta) {
                mergedMeta.ETA = eta;
                mergedMeta.eta = eta;
            }

            const merged = Object.assign({}, prev, incoming, {
                MetaData: mergedMeta,
                IMO: imo || incoming.IMO || prev.IMO || 'N/A',
                imo: imo || incoming.imo || prev.imo || '',
                destination,
                Destination: destination,
                updatedAt: incoming.updatedAt || Date.now()
            });
            if (eta) {
                merged.eta = eta;
                merged.ETA = eta;
            }
            return merged;
        }

        window.readAisNum = function(...vals) {
            for (const v of vals) {
                if (v !== undefined && v !== null && v !== '') {
                    const n = Number(v);
                    if (Number.isFinite(n)) return n;
                }
            }
            return null;
        };

        window.evaluateAisVesselCompatibility = function(vessel) {
            if (!vessel) return false;
            const meta = vessel.MetaData || {};
            const dwt = window.readAisNum(vessel.dwt, vessel.DWT, vessel.DWT_real, meta.dwt, meta.DWT, meta.DWT_real);
            const draft = window.readAisNum(vessel.draught, vessel.draft, vessel.Draught, vessel.Draft, meta.draught, meta.Draught, meta.draft, meta.Draft);
            const shipType = vessel.shipType || vessel.ShipType || meta.ShipType || meta.shipType;
            
            const cargoQty = parseFloat(localStorage.getItem('calculator_cargo_qty') || "0") || 0;
            const minDwt = parseFloat(document.getElementById('filter-min-dwt')?.value || localStorage.getItem('ais_filter_min_dwt') || "0") || 0;
            const maxDwt = parseFloat(document.getElementById('filter-max-dwt')?.value || localStorage.getItem('ais_filter_max_dwt') || "200000") || 200000;
            const portMaxDwt = parseFloat(document.getElementById('filter-port-max-dwt')?.value || "0") || 0;
            const maxDraft = parseFloat(localStorage.getItem('calculator_pol_draft') || localStorage.getItem('calculator_pod_draft') || "0") || 0;

            if (shipType !== undefined && shipType !== null && shipType !== '') {
                const numType = Number(shipType);
                if (Number.isFinite(numType) && (numType < 70 || numType > 79)) {
                    return false;
                }
            }

            const requiredMin = minDwt > 0 ? minDwt : (cargoQty > 0 ? cargoQty * 0.85 : 0);
            const effectiveDwt = dwt || (typeof window.classifyVessel === 'function' ? parseFloat(vessel.dwt || 0) : 0);
            if (requiredMin > 0 && effectiveDwt > 0 && effectiveDwt < requiredMin) {
                return false;
            }
            if (maxDwt > 0 && effectiveDwt > 0 && effectiveDwt > maxDwt) {
                return false;
            }
            if (portMaxDwt > 0 && effectiveDwt > 0 && effectiveDwt > portMaxDwt) {
                return false;
            }

            if (maxDraft > 0 && draft !== null && draft > 0 && draft > maxDraft) {
                return false;
            }

            return true;
        };

        window.detenerRadar = function() {
            window.AIS_PROXY_POLLING_ACTIVE = false;
        };

        window.actualizarContadorBuquesAlmacenados = function() {
            const auditMode = !!window.radarWorkflowState.auditMode;
            const total = auditMode ? window.radarWorkflowState.auditVessels.length : window.buquesAlmacenados.size;
            const limite = Number(window.AIS_DUAL_SWEEP_LIMIT) || 1000;
            const porcentaje = Math.min(100, Math.round((total / limite) * 100));
            const progressEl = document.getElementById('ais-storage-progress');
            if (progressEl) progressEl.innerText = auditMode ? `${total} VALIDATED` : `${porcentaje}% / ${limite}`;
            const countEl = document.getElementById('vessels-count');
            if (countEl) countEl.innerText = total;
        };

        window.procesarMensajeAIS = function(nuevoBarco, options = {}) {
            if (window.radarWorkflowState.auditMode && options.source !== 'audit') return false;
            const limite = Number(window.AIS_DUAL_SWEEP_LIMIT) || 1000;
            const idBuque = window.obtenerIdUnicoBuque(nuevoBarco);
            if (!idBuque || idBuque === "N/A" || idBuque === "0") return false;
            const indexed = getIndexedAisVessel(nuevoBarco, idBuque);
            const storageId = indexed.id || idBuque;
            const existente = indexed.vessel || window.buquesEncontrados[storageId] || null;
            if (!existente && window.buquesAlmacenados.size >= limite) {
                window.detenerRadar();
                return false;
            }
            const barcoNormalizado = window.FleetMatchmaker && typeof window.FleetMatchmaker.processAisVessel === 'function'
                ? window.FleetMatchmaker.processAisVessel(mergeAisVesselState(existente, nuevoBarco))
                : mergeAisVesselState(existente, nuevoBarco);

            const isComp = typeof barcoNormalizado.isCompatible === 'boolean'
                ? barcoNormalizado.isCompatible
                : window.evaluateAisVesselCompatibility(barcoNormalizado);
            barcoNormalizado.isCompatible = isComp;
            if (barcoNormalizado.MetaData) barcoNormalizado.MetaData.isCompatible = isComp;

            window.buquesAlmacenados.set(storageId, barcoNormalizado);
            window.buquesEncontrados[storageId] = barcoNormalizado;
            indexAisVesselIdentities(barcoNormalizado, storageId);
            window.actualizarContadorBuquesAlmacenados();
            if (window.buquesAlmacenados.size >= limite) {
                window.detenerRadar();
            }
            window.actualizarVistaRadar();
            return true;
        };

        window.actualizarVistaRadar = function() {
            const listaCompleta = window.radarWorkflowState.auditMode
                ? window.radarWorkflowState.auditVessels
                : Array.from(window.buquesAlmacenados.values());
            const tipoSeleccionado = document.getElementById('radar-taxonomy-select')?.value || window.radarWorkflowState.selectedTaxonomy || 'cargo';
            const listaFiltrada = filtrarRadarPorTipoLocal(listaCompleta, tipoSeleccionado);

            window.rawVesselsInArea = listaFiltrada;
            if (window.MapLoader && typeof window.MapLoader.autoHydrate === 'function') {
                window.MapLoader.autoHydrate(listaFiltrada);
            }
            window.actualizarContadorBuquesAlmacenados();
        };

        window.addEventListener('ais:vessels-updated', function(event) {
            const detail = event && event.detail ? event.detail : {};
            if (detail.source !== 'server-proxy' && detail.source !== 'autoHydrate') return;
            const vessels = Array.isArray(detail.vessels) ? detail.vessels : [];
            if (vessels.length === 0) return;
            window.isAisBatchingRawStore = true;
            try {
                vessels.forEach(v => window.procesarMensajeAIS(v));
            } finally {
                window.isAisBatchingRawStore = false;
                window.actualizarVistaRadar();
            }
        });

        // Initialize Leaflet Map
        var AISmap = L.map('map').setView([36.5, 3.0], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(AISmap);
        var aisClusterGroup = L.layerGroup().addTo(AISmap);
        var aisMapMarkers = [];

        function formatAisEta(dateStr) {
            if (!dateStr || dateStr === 'N/A') return 'N/A';
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return dateStr;
            return date.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function enrichAisProjection(vessel, pol, pod) {
            return vessel;
        }

        function clearAisProjectionLayers() {}
        function drawAisProjection(vessel) {}

        window.updateGeofencePOLDisplay();
        window.drawGeofenceCircle();
    </script>
