# Redirecciones
[[redirects]]
  from = "/api/databridge-port-tariff"
  to = "https://calm-shortbread-55bcfc.netlify.app/api/databridge-port-tariff"
  status = 200
  force = true

[[redirects]]
  from = "/api/get-bunker-prices"
  to = "/.netlify/functions/get-bunker-prices"
  status = 200
  force = true

# Configuración de build
[build]
  command = "npm run build"
  publish = "dist"

# Configuración de funciones
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  timeout = 60

# Función específica con archivos incluidos
[functions."nlp-voyage-extract"]
  included_files = ["wpi.csv"]

# Entorno de desarrollo (si usas Netlify Dev)
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8889

# Variables de entorno para el build
[build.environment]
  NODE_ENV = "production"

# Cabeceras personalizadas
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src * 'unsafe-inline' 'unsafe-eval'; script-src * 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:; connect-src * wss: https:; img-src * data: blob:; style-src * 'unsafe-inline';"

# Redirecciones adicionales
[[redirects]]
  from = "/api/syncPull/*"
  to = "/.netlify/functions/sync-pull/:splat"
  status = 200

[[redirects]]
  from = "/api/v1/vessel/live-profile"
  to = "/.netlify/functions/vessel-live-profile"
  status = 200

[[redirects]]
  from = "/api/v1/voyage/tracking/*"
  to = "/.netlify/functions/voyage-tracking"
  status = 200

[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/api/dossiers"
  to = "/.netlify/functions/dossiers"
  status = 200
  force = true

[[redirects]]
  from = "/api/dossiers/*"
  to = "/.netlify/functions/dossiers/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/route"
  to = "/.netlify/functions/route"
  status = 200

[[redirects]]
  from = "/components.js"
  to = "/public/components.js"
  status = 200

[[redirects]]
  from = "/databridge.html"
  to = "/public/databridge.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
